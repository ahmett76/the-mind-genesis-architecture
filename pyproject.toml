[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmga-governance"
version = "0.1.0"
description = "Reference implementation of The Mind Genesis Architecture (TMGA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Eray Yildiz" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ahmett76/the-mind-genesis-architecture"

[tool.setuptools.packages.find]
where = ["src"]
